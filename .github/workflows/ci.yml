name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Tests (already exists) ───────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          OPENAI_API_KEY: "test-key"
          SECRET_KEY: "test-secret-key"
          LLM_MODEL: "gpt-4o-mini"
        run: pytest tests/ -v

  # ── Job 2: Build and push to ECR (new) ──────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test                                    # ← only runs if tests pass
    if: github.ref == 'refs/heads/main'            # ← only on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/rag-api:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/rag-api:latest .
          docker push $ECR_REGISTRY/rag-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/rag-api:latest